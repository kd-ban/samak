<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#087fdb">

<title>سمك اليوم</title>

<!-- لإنشاء PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

:root{
  --bg:#f4f8fb;
  --card:#ffffff;
  --text:#122332;
  --muted:#70808f;
  --blue:#087fdb;
  --blue2:#27a7f5;
  --line:#e1eaf1;
  --green:#0e9b68;
  --red:#d54a4a;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "SF Arabic",
  "Segoe UI",
  Tahoma,
  Arial,
  sans-serif;
}

.app{
  max-width:650px;
  margin:auto;
  padding-bottom:100px;
}


/* الرأس */

header{
  padding:25px 18px 20px;

  background:
  linear-gradient(
  145deg,
  #e4f4ff,
  #f8fcff
  );
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{

  width:65px;
  height:65px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  var(--blue),
  var(--blue2)
  );

  border-radius:20px;

  font-size:36px;

  box-shadow:
  0 10px 25px
  rgba(8,127,219,.25);
}

h1{
  margin:0;
  font-size:31px;
}

.subtitle{
  margin-top:5px;
  color:var(--muted);
  font-size:14px;
}


/* الصفحات */

.page{

  display:none;

  padding:
  15px 16px
  25px;
}

.page.active{
  display:block;
}


/* الكروت */

.card{

  background:var(--card);

  border:
  1px solid
  var(--line);

  border-radius:20px;

  padding:15px;

  margin-bottom:14px;

  box-shadow:
  0 7px 20px
  rgba(20,50,70,.06);
}

.sectionTitle{

  font-size:20px;

  font-weight:900;

  margin:
  12px 3px
  12px;
}


/* الإدخالات */

label{

  display:block;

  font-weight:800;

  margin-bottom:8px;
}

input,
select,
textarea{

  width:100%;

  border:
  1px solid
  #d7e3ec;

  border-radius:14px;

  padding:13px;

  font-size:16px;

  background:white;

  outline:none;
}

textarea{

  min-height:80px;

  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{

  border-color:
  #6bbaf2;

  box-shadow:
  0 0 0 3px
  rgba(8,127,219,.08);
}


/* البحث */

.searchResult{

  display:none;

  margin-top:12px;

  border-radius:20px;

  padding:20px;

  color:white;

  background:
  linear-gradient(
  145deg,
  var(--blue),
  var(--blue2)
  );

  box-shadow:
  0 12px 25px
  rgba(8,127,219,.22);
}

.resultName{

  font-size:22px;

  font-weight:900;
}

.resultPrice{

  font-size:40px;

  font-weight:1000;

  margin:
  5px 0;
}

.resultUnit{

  font-size:13px;

  opacity:.9;
}


/* عرض السمك */

.fishGrid{

  display:grid;

  gap:12px;
}

.fishCard{

  display:grid;

  grid-template-columns:
  100px 1fr;

  gap:14px;

  align-items:center;

  background:white;

  border:
  1px solid
  var(--line);

  border-radius:20px;

  padding:12px;

  box-shadow:
  0 7px 18px
  rgba(20,50,70,.05);
}

.fishImage{

  width:100px;

  height:100px;

  overflow:hidden;

  border-radius:17px;

  background:
  #e7f6ff;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:45px;
}

.fishImage img{

  width:100%;

  height:100%;

  object-fit:cover;
}

.fishName{

  font-size:19px;

  font-weight:900;
}

.fishPrice{

  color:var(--blue);

  font-weight:900;

  margin-top:5px;
}

.fishInfo{

  color:var(--muted);

  font-size:13px;

  margin-top:5px;

  line-height:1.5;
}


/* الصفوف */

.row{

  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:10px;
}


/* الأزرار */

button{

  font-family:inherit;
}

.btn{

  width:100%;

  border:none;

  border-radius:15px;

  padding:14px;

  font-size:16px;

  font-weight:900;

  cursor:pointer;
}

.primary{

  background:var(--blue);

  color:white;
}

.secondary{

  background:#e8f4ff;

  color:#076bbd;
}

.danger{

  background:#fff0f0;

  color:var(--red);
}


/* الحاسبة */

.totalBox{

  margin-top:14px;

  padding:16px;

  border-radius:16px;

  background:#e9f8f2;

  color:#08714c;

  font-size:24px;

  font-weight:1000;
}


/* الفاتورة */

.invoice{

  margin-top:16px;

  background:white;

  border-radius:20px;

  padding:20px;

  border:
  1px solid
  var(--line);
}

.invoiceTitle{

  text-align:center;

  font-size:29px;

  font-weight:1000;

  color:var(--blue);
}

.invoiceSub{

  text-align:center;

  color:var(--muted);

  margin-top:4px;
}

.invoiceRows{

  margin-top:20px;

  display:grid;

  gap:9px;
}

.invoiceRow{

  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:12px;

  border-radius:12px;

  background:#f6f9fb;
}

.invoiceTotal{

  background:#e8f8f2;

  color:#08714c;

  font-size:20px;

  font-weight:1000;
}


/* الإدارة */

.imagePreview{

  margin-top:10px;

  text-align:center;
}

.imagePreview img{

  max-width:180px;

  max-height:180px;

  border-radius:18px;
}

.adminFish{

  display:grid;

  grid-template-columns:
  1fr 110px 50px;

  gap:7px;

  margin-bottom:8px;
}

.adminFish input{

  padding:10px;

  font-size:14px;
}

.deleteButton{

  border:none;

  border-radius:12px;

  background:#fff0f0;

  color:var(--red);

  font-size:22px;

  font-weight:bold;
}


/* القائمة السفلية */

.bottomNav{

  position:fixed;

  bottom:0;

  left:50%;

  transform:
  translateX(-50%);

  width:min(
  650px,
  100%
  );

  display:grid;

  grid-template-columns:
  repeat(3,1fr);

  background:
  rgba(255,255,255,.96);

  backdrop-filter:
  blur(15px);

  border-top:
  1px solid
  var(--line);

  padding:
  8px 8px
  calc(
  8px +
  env(safe-area-inset-bottom)
  );

  z-index:100;
}

.bottomNav button{

  border:none;

  background:transparent;

  color:#788895;

  font-size:12px;

  font-weight:800;

  padding:5px;
}

.bottomNav button.active{

  color:var(--blue);
}

.navIcon{

  display:block;

  font-size:23px;

  margin-bottom:3px;
}


/* للجوال */

@media(max-width:430px){

  .row{
    grid-template-columns:1fr;
  }

  .fishCard{

    grid-template-columns:
    86px 1fr;
  }

  .fishImage{

    width:86px;

    height:86px;
  }

}

</style>
</head>


<body>


<div class="app">


<!-- رأس التطبيق -->

<header>

<div class="brand">

<div>

<h1>
سمك اليوم
</h1>

<div class="subtitle">
اكتب اسم السمكة ويظهر سعرها مباشرة
</div>

</div>


<div class="logo">
🐟
</div>

</div>

</header>



<!-- الرئيسية -->

<section
id="home"
class="page active"
>


<div class="card">

<label>
ابحث عن السمكة
</label>


<input
id="searchInput"
placeholder="مثال: الشريفي"
autocomplete="off"
>


<div
id="searchResult"
class="searchResult"
>

<div
id="resultName"
class="resultName">
</div>


<div
id="resultPrice"
class="resultPrice">
</div>


<div
class="resultUnit">
سعر الكيلو
</div>

</div>

</div>



<div class="sectionTitle">
السمك المتوفر
</div>


<div
id="fishGrid"
class="fishGrid">
</div>


</section>




<!-- الحاسبة -->

<section
id="calculator"
class="page"
>


<div class="sectionTitle">
حاسبة السعر
</div>


<div class="card">


<label>
اكتب اسم السمكة
</label>


<input
id="calculatorSearch"
placeholder="مثال: الشريفي"
autocomplete="off"
>


<br><br>


<label>
نوع السمك
</label>


<select
id="calculatorFish">
</select>


<br><br>


<div class="row">


<div>

<label>
الوزن بالكيلو
</label>


<input
id="weightInput"
type="number"
inputmode="decimal"
step="0.01"
placeholder="مثال: 3"
>

</div>


<div>

<label>
اسم العميل
</label>


<input
id="customerInput"
placeholder="اختياري"
>

</div>


</div>


<div
id="priceDescription"
style="
margin-top:12px;
color:#6f8190;
font-size:14px
">
</div>


<div
id="totalBox"
class="totalBox">

الإجمالي:
0 ريال

</div>

</div>



<button
class="btn primary"
onclick="createPDF()"
>

حفظ الحساب PDF

</button>




<div
id="invoice"
class="invoice"
>


<div class="invoiceTitle">
سمك اليوم
</div>


<div class="invoiceSub">
فاتورة حساب السمك
</div>


<div class="invoiceRows">


<div class="invoiceRow">

<span>
التاريخ
</span>

<b id="invoiceDate">
-
</b>

</div>



<div class="invoiceRow">

<span>
اسم العميل
</span>

<b id="invoiceCustomer">
-
</b>

</div>



<div class="invoiceRow">

<span>
نوع السمك
</span>

<b id="invoiceFish">
-
</b>

</div>



<div class="invoiceRow">

<span>
سعر الكيلو
</span>

<b id="invoicePrice">
-
</b>

</div>



<div class="invoiceRow">

<span>
الوزن
</span>

<b id="invoiceWeight">
-
</b>

</div>



<div class="
invoiceRow
invoiceTotal
">

<span>
الإجمالي
</span>

<b id="invoiceTotal">
-
</b>

</div>


</div>

</div>


</section>





<!-- الإدارة -->

<section
id="admin"
class="page"
>


<div class="sectionTitle">
إضافة سمكة
</div>


<div class="card">


<label>
صورة السمكة
</label>


<input
id="fishImageInput"
type="file"
accept="image/*"
>


<div
id="imagePreview"
class="imagePreview">
</div>



<br>


<div class="row">


<div>

<label>
اسم السمكة
</label>


<input
id="newFishName"
placeholder="مثال: هامور"
>

</div>



<div>

<label>
سعر الكيلو
</label>


<input
id="newFishPrice"
type="number"
inputmode="decimal"
placeholder="مثال: 50"
>

</div>


</div>



<br>


<div class="row">


<div>

<label>
الكمية المتوفرة
</label>


<input
id="newFishStock"
type="number"
inputmode="decimal"
placeholder="بالكيلو"
>

</div>



<div>

<label>
الحالة
</label>


<select id="newFishStatus">

<option>
متوفر
</option>

<option>
قليل
</option>

<option>
غير متوفر
</option>

</select>

</div>


</div>



<br>


<label>
ملاحظات
</label>


<textarea
id="newFishNotes"
placeholder="مثال: طازج اليوم"
></textarea>


<br>

class="btn primary"
onclick="addFish()"

إضافة السمكة

</button>


</div>

تعديل الأسعار
</div>


<div class="card">


<div
id="adminFishList">
</div>


<button
class="btn secondary"
onclick="savePriceChanges()"
>

حفظ التعديلات

</button>


</div>



<button
class="btn danger"
onclick="resetFish()"
>

استعادة القائمة الأساسية

</button>


</section>



</div>





<!-- القائمة السفلية -->

<nav class="bottomNav">


<button
class="active"
onclick="
openPage(
'home',
this
)
"
>

<span class="navIcon">
🐟
</span>

الرئيسية

</button>



<button
onclick="
openPage(
'calculator',
this
)
"
>

<span class="navIcon">
🧮
</span>

الحاسبة

</button>



<button
onclick="
openPage(
'admin',
this
)
"
>

<span class="navIcon">
⚙️
</span>

الإدارة

</button>

<script>


/* الأسعار الأساسية */

const defaultFish = [


{

name:"الناجل",

price:65,

stock:"",

status:"متوفر",

notes:"",

image:""

},


{

name:"الشريفي",

price:65,

stock:"",

status:"متوفر",

notes:"",

image:""

},


{

name:"بياض قز",

price:25,

stock:"",

status:"متوفر",

notes:"",

image:""

},


{

name:"بياض قرم",

price:20,

stock:"",

status:"متوفر",

notes:"",

image:""

},


{

name:"شعور",

price:35,

stock:"",

status:"متوفر",

notes:"",

image:""

}


];



let fishList =

JSON.parse(

localStorage.getItem(
"fishData"
)

)

||

defaultFish.map(

fish => ({
...fish
})

);



let selectedImage = "";




/* حفظ */

function saveData(){

localStorage.setItem(

"fishData",

JSON.stringify(
fishList
)

);

}



/* تنسيق السعر */

function formatPrice(value){

const number =
Number(value || 0);


if(
Number.isInteger(number)
){

return
String(number);

}


return
number.toFixed(2);

}



/* تنظيف الاسم */

function normalizeName(value){

return String(
value || ""
)

.trim()

.replace(
/[ًٌٍَُِّْـ]/g,
""
)

.replace(
/\s+/g,
" "
)

.toLowerCase();

}




/* حماية النص */

function escapeHTML(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}




/* التنقل */

function openPage(
pageID,
button
){

document
.querySelectorAll(
".page"
)
.forEach(

page =>
page.classList.remove(
"active"
)

);


document
.getElementById(
pageID
)
.classList.add(
"active"
);



document
.querySelectorAll(
".bottomNav button"
)
.forEach(

item =>
item.classList.remove(
"active"
)

);


button.classList.add(
"active"
);

}




/* عرض السمك */

function renderFish(){

const container =

document.getElementById(
"fishGrid"
);



container.innerHTML =

fishList.map(

fish => `


<div class="fishCard">


<div class="fishImage">


${

fish.image

?

`<img
src="${fish.image}"
alt="${escapeHTML(fish.name)}"
>`

:

"🐟"

}


</div>



<div>


<div class="fishName">

${escapeHTML(fish.name)}

</div>


<div class="fishPrice">

${formatPrice(fish.price)}
ريال / كجم

</div>


<div class="fishInfo">


${

fish.stock

?

`المتوفر:
${escapeHTML(fish.stock)}
كجم
<br>`

:

""

}


الحالة:

${escapeHTML(
fish.status ||
"متوفر"
)}


${

fish.notes

?

`<br>
${escapeHTML(fish.notes)}
`

:

""

}


</div>


</div>


</div>


`

).join("");

}



/* البحث */

const searchInput =

document.getElementById(
"searchInput"
);


searchInput.addEventListener(

"input",

searchFish

);



function searchFish(){

const searchValue =

normalizeName(
searchInput.value
);


const resultBox =

document.getElementById(
"searchResult"
);



if(
!searchValue
){

resultBox.style.display =
"none";

return;

}



let foundFish =

fishList.find(

fish =>

normalizeName(
fish.name
)

===

searchValue

);



if(
!foundFish
){

foundFish =

fishList.find(

fish =>

normalizeName(
fish.name
)

.includes(
searchValue
)

);

}



resultBox.style.display =
"block";



if(
foundFish
){

document
.getElementById(
"resultName"
)
.textContent =
foundFish.name;


document
.getElementById(
"resultPrice"
)
.textContent =

formatPrice(
foundFish.price
)

+

" ريال";

}


else{


document
.getElementById(
"resultName"
)
.textContent =
"السمكة غير موجودة";


document
.getElementById(
"resultPrice"
)
.textContent =
"—";

}

}




/* الحاسبة */

function renderCalculator(){

const select =

document.getElementById(
"calculatorFish"
);



select.innerHTML =

fishList.map(

(fish,index) => `

<option value="${index}">

${escapeHTML(fish.name)}

—

${formatPrice(fish.price)}

ريال

</option>

`

).join("");


updateCalculator();

}



document
.getElementById(
"calculatorFish"
)
.addEventListener(
"change",
updateCalculator
);


document
.getElementById(
"weightInput"
)
.addEventListener(
"input",
updateCalculator
);


document
.getElementById(
"customerInput"
)
.addEventListener(
"input",
updateCalculator
);



document
.getElementById(
"calculatorSearch"
)
.addEventListener(

"input",

function(){

const value =

normalizeName(
this.value
);


if(
!value
){

return;

}


let index =

fishList.findIndex(

fish =>

normalizeName(
fish.name
)

===

value

);


if(
index === -1
){

index =

fishList.findIndex(

fish =>

normalizeName(
fish.name
)

.includes(
value
)

);

}



if(
index >= 0
){

document
.getElementById(
"calculatorFish"
)
.value =
String(index);


updateCalculator();

}

}

);



function updateCalculator(){

if(
fishList.length === 0
){

return;

}


const index =

Number(

document
.getElementById(
"calculatorFish"
)
.value

|| 0

);



const fish =

fishList[index]

||

fishList[0];



const weight =

Number(

document
.getElementById(
"weightInput"
)
.value

|| 0

);



const total =

Number(fish.price)

*

weight;



document
.getElementById(
"priceDescription"
)
.textContent =

fish.name

+

" — سعر الكيلو "

+

formatPrice(
fish.price
)

+

" ريال";



document
.getElementById(
"totalBox"
)
.textContent =

"الإجمالي: "

+

formatPrice(total)

+

" ريال";



/* الفاتورة */


document
.getElementById(
"invoiceDate"
)
.textContent =

new Date()
.toLocaleString(
"ar-SA"
);



document
.getElementById(
"invoiceCustomer"
)
.textContent =

document
.getElementById(
"customerInput"
)
.value.trim()

||

"—";



document
.getElementById(
"invoiceFish"
)
.textContent =
fish.name;



document
.getElementById(
"invoicePrice"
)
.textContent =

formatPrice(
fish.price
)

+

" ريال";



document
.getElementById(
"invoiceWeight"
)
.textContent =

formatPrice(
weight
)

+

" كجم";



document
.getElementById(
"invoiceTotal"
)
.textContent =

formatPrice(
total
)

+

" ريال";

}




/* PDF */

async function createPDF(){

updateCalculator();


const invoice =

document.getElementById(
"invoice"
);



const canvas =

await html2canvas(

invoice,

{

scale:2,

backgroundColor:"#ffffff"

}

);



const imageData =

canvas.toDataURL(
"image/png"
);



const {

jsPDF

} =

window.jspdf;



const pdf =

new jsPDF(

{

orientation:"portrait",

unit:"mm",

format:"a4"

}

);



const pageWidth =

pdf.internal.pageSize
.getWidth();



const imageWidth =

pageWidth - 20;



const imageHeight =

canvas.height

*

imageWidth

/

canvas.width;



pdf.addImage(

imageData,

"PNG",

10,

10,

imageWidth,

imageHeight

);



pdf.save(

"سمك-اليوم.pdf"

);

}

/* حفظ تعديل الأسعار */

function savePriceChanges(){


document
.querySelectorAll(
"[data-name]"
)
.forEach(

input => {

const index =

Number(
input.dataset.name
);


if(
fishList[index]
){

fishList[index].name =

input.value.trim()

||

fishList[index].name;

}

}

);



document
.querySelectorAll(
"[data-price]"
)
.forEach(

input => {

const index =

Number(
input.dataset.price
);


const price =

Number(
input.value
);


if(
fishList[index]

&&

price > 0
){

fishList[index].price =
price;

}

}

);



saveData();

renderAll();


alert(
"تم حفظ التعديلات"
);

}




/* حذف */

function deleteFish(index){

if(

confirm(
"هل تريد حذف هذه السمكة؟"
)

){

fishList.splice(
index,
1
);


saveData();

renderAll();

}

}

function resetFish(){

confirm(
"هل تريد استعادة الأسعار الأساسية؟"
)

){

fishList =

defaultFish.map(

fish => ({
...fish
})

);


saveData();

renderAll();

}

}
